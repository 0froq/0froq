# Refreshes GitHub metrics in the Stack SVGs and the stack image alt, then commits to main.
#   Action:  Actions tab > "stats" > Run workflow (also runs every 6 hours).
#   Locally: GITHUB_TOKEN=$(gh auth token) node scripts/stats.mjs
# README.md is hand-written Markdown; stats.mjs only edits Stack metric glyphs and <img alt>.
# Optional STATS_TOKEN secret (PAT, read:user) also counts private contributions.
name: stats

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stats.mjs
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && exit 0
          git commit -m "stats: update"
          git pull --rebase origin main
          git push origin HEAD:main
